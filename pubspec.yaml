name: moneytrail
description: MoneyTrail - an offline-first personal expense tracker with budgets, analytics and smart insights.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  # Wide range on purpose: flutter_test/flutter_localizations pin intl per Flutter release.
  intl: ">=0.18.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#600964"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#600964"
    theme_color: "#600964"

flutter:
  uses-material-design: true
  assets:
    - assets/images/